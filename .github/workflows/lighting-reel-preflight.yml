name: Lighting Reel Static Preflight

on:
  pull_request:
    paths:
      - "production/colab/cape_jones_lighting_reel_colab.ipynb"
      - "production/colab/validate_lighting_reel_notebook.py"
      - ".github/workflows/lighting-reel-preflight.yml"
  push:
    branches:
      - main
    paths:
      - "production/colab/cape_jones_lighting_reel_colab.ipynb"
      - "production/colab/validate_lighting_reel_notebook.py"
      - ".github/workflows/lighting-reel-preflight.yml"

permissions:
  contents: read

jobs:
  static-preflight:
    name: Validate lighting reel notebook
    runs-on: ubuntu-latest
    # 15 min: the 80k-file tree checkout alone exceeds the old 2-min cap
    # (CJ #397 revert timed out at checkout); validation itself is seconds.
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run static preflight
        run: python production/colab/validate_lighting_reel_notebook.py
