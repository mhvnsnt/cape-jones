# Aider configuration for cape-jones — repo-level defaults (aider.chat/docs/config.html)
# Loaded automatically when aider runs from the repo root. Never put API keys here.
# Lane guide: docs/dev/AIDER.md. Conventions: docs/dev/AIDER-CONVENTIONS.md

# ---- model: FREE tier by default ----
# gemini-exp = Gemini 2.5 Pro Exp, free with usage limits (aider.chat/docs/llms/gemini.html).
# Needs GEMINI_API_KEY in the environment (export, or --api-key gemini=<key>).
# Get a key at https://aistudio.google.com (Google sign-in required — needs browser).
# Paid higher-limit run: aider --model gemini   (was: gemini/gemini-2.0-flash, stale)
model: gemini-exp
editor-model: gemini-exp
weak-model: gemini-exp

# ---- git: aider NEVER commits on its own ----
# Lanes commit deliberately: branch -> PR -> verify green/mergeable -> merge.
auto-commits: false
dirty-commits: false
attribute-co-authored-by: false
git: true
gitignore: true
aiderignore: .aiderignore

# ---- behavior ----
watch-files: true        # pick up edits made outside aider
show-diffs: true         # show diffs before applying
dark-mode: false         # irrelevant in non-interactive lane runs
pretty: true
stream: true

# ---- unattended lanes: pass --yes-always on the command line when non-interactive ----
yes-always: false
suggest-shell-commands: false

# ---- privacy / quietness ----
analytics-disable: true
check-update: false      # no upgrade prompts mid-lane
